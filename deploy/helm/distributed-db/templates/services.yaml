{{- $base := include "distributed-db.fullname" . -}}
# Headless services publish not-ready addresses so a starting Raft group can
# resolve peers before it has a quorum and before readiness passes.
apiVersion: v1
kind: Service
metadata:
  name: {{ $base }}-meta-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "distributed-db.labels" . | nindent 4 }}
    app.kubernetes.io/component: meta
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "distributed-db.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: meta
  ports:
    - name: grpc
      port: {{ .Values.meta.port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $base }}-meta
  namespace: {{ .Release.Namespace }}
