syntax = "proto3";

package proto;

option go_package = "distributed-db/proto";

// Node service definition
service NodeService {
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc Gossip (GossipRequest) returns (GossipResponse);
  rpc PutData (PutRequest) returns (PutResponse);
  rpc GetData (GetRequest) returns (GetResponse);
  rpc DeleteData (DeleteRequest) returns (DeleteResponse);
  rpc ShardHeartbeat (ShardHeartbeatRequest) returns (ShardHeartbeatResponse);
}

message RequestVoteRequest {
  int32 term = 1;
  string candidateId = 2;
  int32 lastLogIndex = 3;
  int32 lastLogTerm = 4;
}

message RequestVoteResponse {
  int32 term = 1;
  bool voteGranted = 2;
}

message AppendEntriesRequest {
  int32 term = 1;
  string leaderId = 2;
  int32 prevLogIndex = 3;
  int32 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  int32 leaderCommit = 6;
}

message AppendEntriesResponse {
  int32 term = 1;
  bool success = 2;
  repeated LogEntry entries = 3;
  int32 conflictIndex = 4;
}

message LogEntry {
    int32 term = 1;
    int32 index = 2;
    string key = 3;
}

message GossipRequest {
    map<int32, ShardInfo> shards = 1;
    map<string, NodeInfo> nodes = 2;
    int32 nodeVersion = 3;
}
message GossipResponse {
    int32 nodeVersion = 1;
}
message ShardInfo {
    int32 shardId = 1;
    string leader = 2;
}
message NodeInfo {
    string address = 1;
}
message PutRequest {
    string key = 1;
}
message PutResponse {
    bool success = 1;
}
message GetRequest {
    string key = 1;
}
message GetResponse {
    bool success = 1;
}
message DeleteRequest {
    string key = 1;
}
message DeleteResponse {
}
message ShardHeartbeatRequest{
 int32 shardId = 1;
 string leaderAddress = 2;
}
message ShardHeartbeatResponse {
 bool success = 1;
}
