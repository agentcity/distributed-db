syntax = "proto3";

package dbv2;

option go_package = "distributed-db/internal/pb/v2;pbv2";

// KVService is the transactional KV API exposed by every v2 node.
service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  // ScanForBackup is the lock-aware variant of Scan used by logical backups.
  // It returns the same visible key/value set as Scan at ts, but fails closed
  // with locked=true (and error="locked") when a lock with startTS <= ts is
  // present anywhere in [start, end), including a key that has never been
  // committed. That is what lets a remote backup distinguish "no value" from
  // "a transaction may still become visible below the snapshot TSO".
  //
  // The RPC and its messages are additive: older servers answer Unimplemented,
  // which a strict backup client treats as a hard error; older clients never
  // call the method. The response keeps the historical in-band string error,
  // but locked/locked_key/lock_ts carry structured details so a client can
  // build a precise lock error instead of parsing error text.
  rpc ScanForBackup(ScanForBackupRequest) returns (ScanForBackupResponse);
  rpc Prewrite(PrewriteRequest) returns (PrewriteResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc CommitSingle(CommitSingleRequest) returns (CommitSingleResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc CheckTxnStatus(CheckTxnStatusRequest) returns (CheckTxnStatusResponse);
  rpc ResolveLock(ResolveLockRequest) returns (ResolveLockResponse);
  rpc SplitRange(SplitRangeRequest) returns (SplitRangeResponse);
  rpc MergeRanges(MergeRangesRequest) returns (MergeRangesResponse);
  rpc RangeStats(RangeStatsRequest) returns (RangeStatsResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  // TransferLeader moves leadership of one range to target. The request is
  // served by the current leader; epoch is optional (0 disables the check).
  rpc TransferLeader(TransferLeaderRequest) returns (TransferLeaderResponse);

  // Replica-set membership. Changes are single-server (no joint consensus):
  // AddReplica creates a non-voting Raft group on the target node, AddLearner
  // registers that node as a learner on the range leader, PromoteReplica turns
  // the caught-up learner into a voter and RemoveVoter removes a voter on the
  // leader. RemoveReplica stops the group on the target after the leader has
  // confirmed the removal. Epoch is optional; 0 disables the epoch check.
  rpc AddReplica(AddReplicaRequest) returns (AddReplicaResponse);
  rpc AddLearner(AddLearnerRequest) returns (MembershipResponse);
  rpc PromoteReplica(PromoteReplicaRequest) returns (MembershipResponse);
  rpc RemoveVoter(RemoveVoterRequest) returns (MembershipResponse);
  rpc RemoveReplica(RemoveReplicaRequest) returns (RemoveReplicaResponse);
  rpc Membership(MembershipRequest) returns (MembershipResponse);
  // UpdateRangeEpoch locally records the range version published by meta on
  // one replica. The scheduler fans it out before publishing a new range map
  // so every replica accepts requests carrying the new version.
  rpc UpdateRangeEpoch(UpdateRangeEpochRequest) returns (UpdateRangeEpochResponse);
}

// RaftService is the Raft peer transport.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  // InstallSnapshot is the legacy unary snapshot transfer. It carries the
  // whole snapshot in one bytes field and is kept for compatibility.
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  // InstallSnapshotChunk streams one snapshot as a sequence of chunks. The
  // leader sends sequential offset values and finishes with done=true.
  //
  // The response carries the protocol outcome: term is the follower's current
  // term (the leader must step down if it is higher), success reports whether
  // the chunk was accepted, last_index is the follower's last log index (set
  // when done=true is accepted) and error describes a rejected chunk (bad
  // offset, size, checksum or restore failure). Transport-level failures such
  // as an unknown range, a stopped node or a cancelled RPC are reported as
  // gRPC status errors instead of a response.
  rpc InstallSnapshotChunk(InstallSnapshotChunkRequest) returns (InstallSnapshotChunkResponse);
  // TimeoutNow asks a follower to start an election immediately. It is sent
  // by a leader that is transferring leadership to that follower; term must
  // match the follower's current term or the request is rejected.
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

// MetaService owns the timestamp oracle for v2 transactions.
service MetaService {
  rpc AllocTS(AllocTSRequest) returns (AllocTSResponse);
  rpc GetRange(GetRangeRequest) returns (RangeInfo);
  rpc ListRanges(ListRangesRequest) returns (ListRangesResponse);
  rpc Leader(LeaderRequest) returns (LeaderResponse);
  rpc SetRanges(SetRangesRequest) returns (SetRangesResponse);
  rpc SplitRange(MetaSplitRangeRequest) returns (MetaSplitRangeResponse);
  rpc MergeRanges(MetaMergeRangesRequest) returns (MetaMergeRangesResponse);
}

message GetRequest {
  bytes key = 1;
  uint64 ts = 2;
}
message GetResponse {
  bool found = 1;
  bytes value = 2;
  string leader = 3;
  string error = 4;
}

message ScanRequest {
  bytes start = 1;
  bytes end = 2;
  uint64 ts = 3;
  int32 limit = 4;
}
message KV {
  bytes key = 1;
  bytes value = 2;
}
message ScanResponse {
  repeated KV kvs = 1;
  string leader = 2;
  string error = 3;
}

// ScanForBackupRequest asks one range for a lock-aware snapshot scan.
//
// range_id is optional: 0 lets the server resolve the range from start, which
// is what the backup RemoteScanner adapter uses so a concurrent split/merge is
// still rejected through the normal epoch check rather than pinned to a stale
// descriptor. A non-zero range_id pins the request to that range and must
// contain [start, end).
message ScanForBackupRequest {
  uint64 range_id = 1;
  bytes start = 2;
  bytes end = 3;
  uint64 ts = 4;
  int32 limit = 5;
}
// ScanForBackupResponse is the lock-aware counterpart of ScanResponse.
//
// locked is true when the server found a lock with startTS <= ts in the
// requested interval. In that case kvs is empty: a partial result must never be
// mistaken for a complete snapshot. locked_key and lock_ts identify the first
// blocking lock. error is "locked" for this case; other failures use the
// existing opError categories ("not leader", "range mismatch", ...).
message ScanForBackupResponse {
  repeated KV kvs = 1;
  string leader = 2;
  string error = 3;
  bool locked = 4;
  bytes locked_key = 5;
  uint64 lock_ts = 6;
}

message Mutation {
  bytes key = 1;
  bytes value = 2;
  bool delete = 3;
}
message PrewriteRequest {
  uint64 start_ts = 1;
  bytes primary = 2;
  repeated Mutation mutations = 3;
}
message PrewriteResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
}

message CommitRequest {
  uint64 start_ts = 1;
  uint64 commit_ts = 2;
  repeated bytes keys = 3;
}
message CommitResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
}

message CommitSingleRequest {
  uint64 start_ts = 1;
  uint64 commit_ts = 2;
  bytes primary = 3;
  repeated Mutation mutations = 4;
}
message CommitSingleResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
}

message RollbackRequest {
  uint64 start_ts = 1;
  repeated bytes keys = 2;
}
message RollbackResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
}

message CheckTxnStatusRequest {
  bytes key = 1;
  uint64 start_ts = 2;
}
message CheckTxnStatusResponse {
  bool committed = 1;
  uint64 commit_ts = 2;
  bool rolled_back = 3;
  bytes lock_primary = 4;
  uint64 lock_ts = 5;
  uint64 ttl_ms = 6;
  bool expired = 7;
  repeated bytes keys = 8;
  string leader = 9;
  string error = 10;
}

message ResolveLockRequest {
  repeated bytes keys = 1;
  uint64 start_ts = 2;
  uint64 commit_ts = 3;
}
message ResolveLockResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
}

message SplitRangeRequest {
  uint64 range_id = 1;
  bytes split_key = 2;
  uint64 new_range_id = 3;
  uint64 epoch = 4;
}
message SplitRangeResponse {
  bool success = 1;
  string error = 2;
  string leader = 3;
}

message MergeRangesRequest {
  uint64 left_range_id = 1;
  uint64 right_range_id = 2;
  uint64 epoch = 3;
  bytes right_end = 4;
}
message MergeRangesResponse {
  bool success = 1;
  string error = 2;
  string leader = 3;
}

// RangeStats reports approximate size/key statistics for one hosted range.
// The meta scheduler uses size_bytes and split_key to trigger an auto-split.
message RangeStatsRequest {
  uint64 range_id = 1;
  uint64 epoch = 2; // optional; 0 disables the epoch check
}
message RangeStatsResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
  uint64 size_bytes = 4;
  uint64 key_count = 5;
  bytes split_key = 6; // empty when the range has too few keys to split
  bytes start = 7;
  bytes end = 8;
}

message StatusRequest {
  uint64 range_id = 1;
}
message StatusResponse {
  string id = 1;
  string role = 2;
  uint64 term = 3;
  string leader = 4;
  uint64 commit_index = 5;
  uint64 last_applied = 6;
  uint64 range_id = 7;
  bytes range_start = 8;
  bytes range_end = 9;
  uint64 epoch = 10;
  // Raft membership of this range. voters includes the local node when it is
  // a voter; learners are non-voting. learner reports whether the local node
  // is currently a learner.
  repeated string voters = 11;
  repeated string learners = 12;
  bool learner = 13;
}

// TransferLeaderRequest asks the serving leader of range_id to hand
// leadership to target, which must be another replica of the range. epoch is
// optional; 0 skips the range-epoch check.
message TransferLeaderRequest {
  uint64 range_id = 1;
  string target = 2;
  uint64 epoch = 3;
}
message TransferLeaderResponse {
  bool success = 1;
  // leader is the best-known leader hint after the attempt: target when the
  // transfer was accepted, otherwise the current leader (possibly empty).
  string leader = 2;
  string error = 3;
}

// AddReplicaRequest is served by the target node. It creates (or restarts) a
// Raft group for range_id with the supplied bounds and the current voter set,
// as a non-voting learner. Existing data and an existing Raft log are reused;
// catch-up comes from the leader. peers holds the range's current voters and
// may include target, which is filtered out.
message AddReplicaRequest {
  uint64 range_id = 1;
  string target = 2;
  repeated string peers = 3;
  uint64 epoch = 4;
  bytes start = 5;
  bytes end = 6;
}
message AddReplicaResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
}

// AddLearnerRequest is served by the range leader.
message AddLearnerRequest {
  uint64 range_id = 1;
  string target = 2;
  uint64 epoch = 3;
}
// PromoteReplicaRequest is served by the range leader.
message PromoteReplicaRequest {
  uint64 range_id = 1;
  string target = 2;
  uint64 epoch = 3;
}
// RemoveVoterRequest is served by the range leader.
message RemoveVoterRequest {
  uint64 range_id = 1;
  string target = 2;
  uint64 epoch = 3;
}
// RemoveReplicaRequest is served by the target node and stops its local group.
message RemoveReplicaRequest {
  uint64 range_id = 1;
  string target = 2;
}
message RemoveReplicaResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
}

// UpdateRangeEpochRequest sets one replica's cached range version. It never
// changes Raft membership and is idempotent: a version not newer than the
// cached one is accepted without change.
message UpdateRangeEpochRequest {
  uint64 range_id = 1;
  uint64 epoch = 2;
}
message UpdateRangeEpochResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
  uint64 epoch = 4;
}

// MembershipRequest returns the Raft membership of one hosted range.
message MembershipRequest { uint64 range_id = 1; }
message MembershipResponse {
  bool success = 1;
  string leader = 2;
  string error = 3;
  repeated string voters = 4;
  repeated string learners = 5;
}


// TimeoutNowRequest is sent by a leader that is transferring leadership. term
// is the leader's term; the follower accepts only when it matches its own.
message TimeoutNowRequest {
  uint64 range_id = 1;
  uint64 term = 2;
  string leader_id = 3;
}
message TimeoutNowResponse {
  // term is the follower's term at validation time. A stale request is
  // rejected with success=false and the follower's current term.
  uint64 term = 1;
  bool success = 2;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  uint64 range_id = 5;
}
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  string type = 3;
  bytes key = 4;
  bytes value = 5;
}
message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  uint64 range_id = 7;
}
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
}

message SnapshotMembership {
  repeated string voters = 1;
  repeated string learners = 2;
  uint64 config_epoch = 3;
  repeated string voters_old = 4;
  bool auto_finalize = 5;
}
message Snapshot {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
  SnapshotMembership membership = 4;
}
message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  Snapshot snapshot = 3;
  uint64 range_id = 4;
}
message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 last_index = 3;
}

// InstallSnapshotChunkRequest is one chunk of a chunked InstallSnapshot.
//
// The first chunk of a stream has offset=0. Every subsequent chunk starts at
// offset == the total number of payload bytes already sent. index and
// snapshot_term identify the snapshot position; size and crc32 are the total
// payload length and IEEE CRC-32 of the complete snapshot and are repeated on
// every chunk (zero means "not supplied"). data is at most 1 MiB. done=true
// marks the final chunk and may carry the last bytes in data; the leader sends
// a final done=true request with empty data at offset=total_size.
message InstallSnapshotChunkRequest {
  uint64 range_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 index = 4;
  uint64 snapshot_term = 5;
  uint64 offset = 6;
  bytes data = 7;
  bool done = 8;
  int64 size = 9;
  uint32 crc32 = 10;
  SnapshotMembership membership = 11;
}
message InstallSnapshotChunkResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 last_index = 3;
  string error = 4;
  // next_offset is the total number of payload bytes accepted so far, i.e.
  // the offset the receiver expects next. It lets a resumed upload continue
  // instead of restarting at zero; this increment only reports it.
  int64 next_offset = 5;
}

message SetRangesRequest {
  repeated RangeInfo ranges = 1;
}
message SetRangesResponse {
  bool success = 1;
  string error = 2;
}

message MetaSplitRangeRequest {
  uint64 range_id = 1;
  bytes split_key = 2;
}
message MetaSplitRangeResponse {
  bool success = 1;
  string error = 2;
  uint64 new_range_id = 3;
}

message MetaMergeRangesRequest {
  uint64 left_range_id = 1;
  uint64 right_range_id = 2;
}
message MetaMergeRangesResponse {
  bool success = 1;
  string error = 2;
}

message LeaderRequest {}
message LeaderResponse {
  string leader = 1;
  uint64 term = 2;
}

message GetRangeRequest { bytes key = 1; }
message RangeInfo {
  uint64 id = 1;
  bytes start = 2;
  bytes end = 3;
  repeated string replicas = 4;
  string leader = 5;
  uint64 version = 6;
}
message ListRangesRequest {}
message ListRangesResponse { repeated RangeInfo ranges = 1; }

message AllocTSRequest { int32 count = 1; }
message AllocTSResponse {
  uint64 start = 1;
  int32 count = 2;
}
